<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мої роботи</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
  <style>
    /* Загальні стилі */
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #f5f5f5, #eaeaea);
      color: #333;
    }

    /* Хедер */
    header {
      background-color: #000;
      color: white;
      padding: 30px 20px;
      text-align: center;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
      position: relative;
      z-index: 1000;
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 45px;
      letter-spacing: 2px;
      margin: 0;
      color: #ff7f50;
      text-shadow: 2px 2px 6px rgba(255, 127, 80, 0.7);
      display: inline-block;
    }

    /* Меню */
    .menu-toggle {
      display: none;
      font-size: 30px;
      color: #fff;
      background: none;
      border: none;
      position: absolute;
      top: 20px;
      right: 20px;
      cursor: pointer;
      z-index: 2000;
    }

    nav {
      position: relative;
      z-index: 1000;
    }

    nav ul {
      list-style: none;
      padding: 0;
      margin: 20px 0 0;
      text-align: center;
      background: rgba(0, 0, 0, 0.9);
    }

    nav ul li {
      display: inline-block;
      margin: 0 15px;
    }

    nav ul li a {
      color: white;
      text-decoration: none;
      font-size: 18px;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: color 0.3s ease;
    }

    nav ul li a:hover {
      color: #f2b01e;
    }

    /* Галерея */
    #portfolio {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 15px;
      padding: 40px 10%;
      text-align: center;
      opacity: 0;
      animation: fadeInUp 1.2s ease-out forwards;
    }

    .photo {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      z-index: 0;
    }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease;
    }

    .photo:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
    }

    /* Футер */
    footer {
      text-align: center;
      padding: 20px;
      background-color: #181818;
      color: white;
      position: relative;
      z-index: 1000;
    }

    /* Анімація */
    @keyframes fadeInUp {
      0% { opacity: 0; transform: translateY(50px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* Адаптивність */
    @media (max-width: 768px) {
      header h1 {
        font-size: 35px;
      }

      .menu-toggle {
        display: block;
      }

      nav ul {
        display: none;
        position: absolute;
        top: 80px;
        left: 0;
        width: 100%;
        background: rgba(0, 0, 0, 0.95);
        text-align: center;
        padding: 15px 0;
        z-index: 2000;
      }

      nav ul.show {
        display: block;
      }

      nav ul li {
        display: block;
        margin: 10px 0;
      }

      #portfolio {
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        padding: 20px;
      }

      .photo {
        z-index: 0;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Мої роботи</h1>
    <button class="menu-toggle" onclick="toggleMenu()">☰</button>
    <nav>
      <ul>
        <li><a href="index.html">Головна</a></li>
        <li><a href="about.html">Про мене</a></li>
        <li><a href="portfolio.html">Мої роботи</a></li>
        <li><a href="contacts.html">Контакти</a></li>
      </ul>
    </nav>
  </header>

  <section id="portfolio">
    <div class="photo">
      <img src="images/photo1.jpg" alt="Фото 1">
    </div>
    <div class="photo">
      <img src="images/photo2.jpg" alt="Фото 2">
    </div>
    <div class="photo">
      <img src="images/photo3.jpg" alt="Фото 3">
    </div>
    <div class="photo">
      <img src="images/photo4.jpg" alt="Фото 4">
    </div>
    <div class="photo">
      <img src="images/photo5.jpg" alt="Фото 5">
    </div>
    <div class="photo">
      <img src="images/photo6.jpg" alt="Фото 6">
    </div>
  </section>

  <footer>
    <p>&copy; 2025 Фотограф Емілія</p>
  </footer>

  <script>
    function toggleMenu() {
      const menu = document.querySelector("nav ul");
      menu.classList.toggle("show");
    }
  </script>
</body>
</html>
