<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Контакти - Фотограф Емілія</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
  <style>
    /* Загальні стилі */
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #f5f5f5, #eaeaea);
      color: #333;
    }

    /* Хедер */
    header {
      background-color: #000;
      color: white;
      padding: 30px 20px;
      text-align: center;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
      position: relative;
      z-index: 1000;
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 45px;
      letter-spacing: 2px;
      margin: 0;
      color: #ff7f50;
      text-shadow: 2px 2px 6px rgba(255, 127, 80, 0.7);
    }

    /* Меню */
    .menu-toggle {
      display: none;
      font-size: 30px;
      color: #fff;
      background: none;
      border: none;
      position: absolute;
      top: 20px;
      right: 20px;
      cursor: pointer;
      z-index: 2000;
    }

    nav ul {
      list-style: none;
      padding: 0;
      margin: 20px 0 0;
      text-align: center;
      background: rgba(0, 0, 0, 0.9);
    }

    nav ul li {
      display: inline-block;
      margin: 0 15px;
    }

    nav ul li a {
      color: white;
      text-decoration: none;
      font-size: 18px;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: color 0.3s ease;
    }

    nav ul li a:hover {
      color: #f2b01e;
    }

    /* Контактна секція */
    .contacts {
      text-align: center;
      padding: 50px 20px;
      max-width: 800px;
      margin: auto;
    }

    .contacts h2 {
      font-size: 35px;
      color: #ff7f50;
      font-family: 'Playfair Display', serif;
      font-weight: bold;
    }

    .contact-box {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 5px 10px rgba(0, 0, 0, 0.2);
      margin: 15px auto;
      display: flex;
      align-items: center;
      gap: 15px;
      max-width: 500px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .contact-box:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
    }

    .contact-box i {
      font-size: 30px;
      color: #ff7f50;
    }

    .contact-box a {
      font-size: 18px;
      color: #333;
      text-decoration: none;
    }

    .contact-box a:hover {
      color: #ff7f50;
    }

    /* Кнопка Instagram */
    .btn-instagram {
      background: linear-gradient(90deg, #ff7f50, #ffb347);
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 20px;
      margin-top: 20px;
      cursor: pointer;
      border-radius: 30px;
      font-weight: bold;
      text-transform: uppercase;
      box-shadow: 0 5px 15px rgba(255, 127, 80, 0.4);
      transition: 0.3s;
      text-decoration: none;
      display: inline-block;
    }

    .btn-instagram:hover {
      transform: scale(1.1);
      box-shadow: 0 10px 30px rgba(255, 127, 80, 0.5);
    }

    /* Футер */
    footer {
      text-align: center;
      padding: 20px;
      background-color: #181818;
      color: white;
    }

    /* Адаптивність */
    @media (max-width: 768px) {
      header h1 {
        font-size: 35px;
      }

      .menu-toggle {
        display: block;
      }

      nav ul {
        display: none;
        position: absolute;
        top: 80px;
        left: 0;
        width: 100%;
        background: rgba(0, 0, 0, 0.95);
        text-align: center;
        padding: 15px 0;
        z-index: 2000;
      }

      nav ul.show {
        display: block;
      }

      nav ul li {
        display: block;
        margin: 10px 0;
      }

      .contact-box {
        flex-direction: column;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Контакти</h1>
    <button class="menu-toggle" onclick="toggleMenu()">☰</button>
    <nav>
      <ul>
        <li><a href="index.html">Головна</a></li>
        <li><a href="about.html">Про мене</a></li>
        <li><a href="portfolio.html">Мої роботи</a></li>
        <li><a href="contacts.html">Контакти</a></li>
      </ul>
    </nav>
  </header>

  <section class="contacts">
    <h2>Зв'язатись зі мною</h2>

    <a href="https://www.instagram.com/emiliapisna_/" target="_blank" class="btn-instagram">
      <i class="fab fa-instagram"></i> Написати в Instagram
    </a>

    <div class="contact-box">
      <i class="fab fa-instagram"></i>
      <a href="https://www.instagram.com/emiliapisna_/" target="_blank">Instagram</a>
    </div>

    <div class="contact-box">
      <i class="fab fa-facebook"></i>
      <a href="https://www.facebook.com/emillija.pisna" target="_blank">Facebook</a>
    </div>

    <div class="contact-box">
      <i class="fas fa-phone"></i>
      <a href="tel:+380123456789">+38 (012) 345-67-89</a>
    </div>

    <div class="contact-box">
      <i class="fas fa-envelope"></i>
      <a href="mailto:emilia@example.com">emilia@example.com</a>
    </div>
  </section>

  <footer>
    <p>&copy; 2025 Фотограф Емілія</p>
  </footer>

  <script>
    function toggleMenu() {
      const menu = document.querySelector("nav ul");
      menu.classList.toggle("show");
    }
  </script>
</body>
</html>
