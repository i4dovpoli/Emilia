<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Про мене</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
  <style>
    /* Загальні стилі */
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #f5f5f5, #eaeaea);
      color: #333;
    }

    /* Хедер */
    header {
      background-color: #000;
      color: white;
      padding: 30px 20px;
      text-align: center;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
      position: relative;
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 45px;
      letter-spacing: 2px;
      margin: 0;
      color: #ff7f50;
      text-shadow: 2px 2px 6px rgba(255, 127, 80, 0.7);
    }

    /* Меню */
    .menu-toggle {
      display: none;
      font-size: 30px;
      color: #fff;
      background: none;
      border: none;
      position: absolute;
      top: 20px;
      right: 20px;
      cursor: pointer;
    }

    nav ul {
      list-style: none;
      padding: 0;
      margin: 20px 0 0;
      text-align: center;
    }

    nav ul li {
      display: inline-block;
      margin: 0 15px;
    }

    nav ul li a {
      color: white;
      text-decoration: none;
      font-size: 18px;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: color 0.3s ease;
    }

    nav ul li a:hover {
      color: #f2b01e;
    }

    /* Про мене */
    #bio {
      text-align: center;
      padding: 50px 20px;
      max-width: 800px;
      margin: auto;
    }

    #bio h2 {
      font-size: 35px;
      color: #ff7f50;
      font-family: 'Playfair Display', serif;
      font-weight: bold;
    }

    #bio p {
      font-size: 18px;
      color: #666;
      line-height: 1.8;
      margin-top: 20px;
    }

    /* Фото профілю */
    .profile-photo {
      width: 250px;
      height: 250px;
      border-radius: 50%;
      margin-top: 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      border: 5px solid #ff7f50;
      transition: transform 0.3s ease;
    }

    .profile-photo:hover {
      transform: scale(1.05);
    }

    /* Кнопка */
    .btn-main {
      background: linear-gradient(90deg, #ff7f50, #ffb347);
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 20px;
      margin-top: 30px;
      cursor: pointer;
      border-radius: 30px;
      font-weight: bold;
      text-transform: uppercase;
      box-shadow: 0 5px 15px rgba(255, 127, 80, 0.4);
      transition: 0.3s;
      text-decoration: none;
      display: inline-block;
    }

    .btn-main:hover {
      transform: scale(1.1);
      box-shadow: 0 10px 30px rgba(255, 127, 80, 0.5);
    }

    /* Футер */
    footer {
      text-align: center;
      padding: 20px;
      background-color: #181818;
      color: white;
    }

    /* Адаптивність */
    @media (max-width: 768px) {
      header h1 {
        font-size: 35px;
      }

      .menu-toggle {
        display: block;
      }

      nav ul {
        display: none;
        position: absolute;
        top: 80px;
        left: 0;
        width: 100%;
        background: rgba(0, 0, 0, 0.9);
        text-align: center;
        padding: 15px 0;
      }

      nav ul li {
        display: block;
        margin: 10px 0;
      }

      .profile-photo {
        width: 200px;
        height: 200px;
      }

      .btn-main {
        font-size: 18px;
        padding: 12px 20px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Про мене</h1>
    <button class="menu-toggle" onclick="toggleMenu()">☰</button>
    <nav>
      <ul>
        <li><a href="index.html">Головна</a></li>
        <li><a href="about.html">Про мене</a></li>
        <li><a href="portfolio.html">Мої роботи</a></li>
        <li><a href="contacts.html">Контакти</a></li>
      </ul>
    </nav>
  </header>

  <section id="bio">
    <img src="images/profile-clear.jpg" alt="Емілія" class="profile-photo">
    <h2>Я — Емілія!</h2>
    <p>Професійний фотограф. Спеціалізуюсь на портретах, весільних фотосесіях та фешн-зйомці.</p>
    <a href="https://www.instagram.com/emiliapisna_/" target="_blank" class="btn-main">Записатися на фотосесію</a>
  </section>

  <footer>
    <p>&copy; 2025 Фотограф Емілія</p>
  </footer>

  <script>
    function toggleMenu() {
      const menu = document.querySelector("nav ul");
      menu.style.display = menu.style.display === "block" ? "none" : "block";
    }
  </script>
</body>
</html>
