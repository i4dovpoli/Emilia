<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Фотограф Емілія</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&family=Great+Vibes&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
  <style>
    /* Загальні стилі */
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #1e1e1e;
      color: #fff;
    }

    /* Хедер */
    header {
      background: linear-gradient(135deg, rgba(0,0,0,0.8), rgba(0,0,0,0.3)), url('images/header-bg.jpg') center/cover;
      text-align: center;
      padding: 40px 20px;
      position: relative;
    }

    header h1 {
      font-family: 'Great Vibes', cursive;
      font-size: 50px;
      font-weight: bold;
      color: #ff7f50;
      text-shadow: 2px 2px 10px rgba(255, 127, 80, 0.7);
    }

    /* Меню */
    .menu-toggle {
      display: none;
      font-size: 30px;
      color: #fff;
      background: none;
      border: none;
      position: absolute;
      top: 20px;
      right: 20px;
      cursor: pointer;
      z-index: 1000;
    }

    nav {
      position: relative;
      z-index: 999;
    }

    nav ul {
      list-style: none;
      padding: 0;
      margin: 20px 0 0;
      text-align: center;
      background: rgba(0, 0, 0, 0.9);
    }

    nav ul li {
      display: inline-block;
      margin: 0 15px;
    }

    nav ul li a {
      color: #ff7f50;
      text-decoration: none;
      font-size: 18px;
      font-weight: 600;
      text-transform: uppercase;
      transition: color 0.3s ease;
    }

    nav ul li a:hover {
      color: #fff;
    }

    /* Інтро */
    #intro {
      text-align: center;
      padding: 80px 20px;
      max-width: 900px;
      margin: auto;
    }

    #intro h2 {
      font-size: 40px;
      font-weight: bold;
      background: linear-gradient(90deg, #ff7f50, #ffb347);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    #intro p {
      font-size: 18px;
      color: #ddd;
      margin-top: 20px;
      background: rgba(0, 0, 0, 0.6);
      padding: 15px;
      border-radius: 10px;
      display: inline-block;
    }

    /* Кнопка */
    .btn-main {
      background: linear-gradient(90deg, #ff7f50, #ffb347);
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 20px;
      margin-top: 30px;
      cursor: pointer;
      border-radius: 30px;
      font-weight: bold;
      text-transform: uppercase;
      box-shadow: 0 5px 15px rgba(255, 127, 80, 0.4);
      transition: 0.3s;
      text-decoration: none;
      display: inline-block;
    }

    .btn-main:hover {
      transform: scale(1.1);
      box-shadow: 0 10px 30px rgba(255, 127, 80, 0.5);
    }

    /* Галерея */
    .gallery {
      text-align: center;
      padding: 40px 20px;
    }

    .gallery img {
      width: 100%;
      height: auto;
      max-width: 400px;
      object-fit: cover;
      border-radius: 10px;
      margin: 10px;
      transition: transform 0.3s ease;
    }

    .gallery img:hover {
      transform: scale(1.05);
      box-shadow: 0 5px 20px rgba(255, 127, 80, 0.4);
    }

    /* Футер */
    footer {
      text-align: center;
      padding: 20px;
      background-color: #181818;
      color: white;
    }

    /* Адаптивність */
    @media (max-width: 768px) {
      header h1 {
        font-size: 35px;
      }

      .menu-toggle {
        display: block;
      }

      nav ul {
        display: none;
        position: absolute;
        top: 80px;
        left: 0;
        width: 100%;
        background: rgba(0, 0, 0, 0.95);
        text-align: center;
        padding: 15px 0;
        z-index: 2000;
      }

      nav ul.show {
        display: block;
      }

      nav ul li {
        display: block;
        margin: 10px 0;
      }

      .gallery img {
        width: 90%;
      }

      .btn-main {
        font-size: 18px;
        padding: 12px 20px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Фотограф Емілія</h1>
    <button class="menu-toggle" onclick="toggleMenu()">☰</button>
    <nav>
      <ul>
        <li><a href="index.html">Головна</a></li>
        <li><a href="about.html">Про мене</a></li>
        <li><a href="portfolio.html">Мої роботи</a></li>
        <li><a href="contacts.html">Контакти</a></li>
      </ul>
    </nav>
  </header>

  <section id="intro">
    <h2>Створюю моменти, що залишаються назавжди</h2>
    <p>Лови справжні емоції разом зі мною. Запишись на фотосесію або переглянь мої роботи.</p>
    <a href="https://www.instagram.com/emiliapisna_/" target="_blank" class="btn-main">Записатися</a>
  </section>

  <section class="gallery">
    <h3>Останні роботи</h3>
    <img src="images/photo1.jpg" alt="Фото 1">
    <img src="images/photo2.jpg" alt="Фото 2">
    <img src="images/photo3.jpg" alt="Фото 3">
  </section>

  <footer>
    <p>&copy; 2025 Фотограф Емілія</p>
  </footer>

  <script>
    function toggleMenu() {
      const menu = document.querySelector("nav ul");
      menu.classList.toggle("show");
    }
  </script>
</body>
</html>
